<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>VR 뉴스 효과 실험</title>
    <!-- A-Frame: 360°/WebXR 렌더 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script>
      // 1. Patch enterVR at prototype level — most aggressive stereo prevention
      AFRAME.AScene.prototype.enterVR = function () { return Promise.resolve(); };

      // 2. Custom touch/mouse look controls with reliable up/down movement
      AFRAME.registerComponent('free-look', {
        init: function () {
          this.pitch = 0;
          this.yaw   = 0;
          this.pointerDown = false;
          this.lastX = 0;
          this.lastY = 0;

          var self = this;
          var canvas = this.el.sceneEl.canvas;

          var onTouchStart = function (e) {
            e.preventDefault();
            self.pointerDown = true;
            self.lastX = e.touches[0].clientX;
            self.lastY = e.touches[0].clientY;
          };
          var onTouchMove = function (e) {
            e.preventDefault();
            if (!self.pointerDown) return;
            var dx = e.touches[0].clientX - self.lastX;
            var dy = e.touches[0].clientY - self.lastY;
            self.yaw   -= dx * 0.25;
            self.pitch -= dy * 0.25;
            self.pitch  = Math.max(-85, Math.min(85, self.pitch));
            self.lastX  = e.touches[0].clientX;
            self.lastY  = e.touches[0].clientY;
            self.apply();
          };
          var onTouchEnd = function () { self.pointerDown = false; };
          var onMouseDown = function (e) {
            self.pointerDown = true;
            self.lastX = e.clientX;
            self.lastY = e.clientY;
          };
          var onMouseMove = function (e) {
            if (!self.pointerDown) return;
            var dx = e.clientX - self.lastX;
            var dy = e.clientY - self.lastY;
            self.yaw   -= dx * 0.25;
            self.pitch -= dy * 0.25;
            self.pitch  = Math.max(-85, Math.min(85, self.pitch));
            self.lastX  = e.clientX;
            self.lastY  = e.clientY;
            self.apply();
          };
          var onMouseUp = function () { self.pointerDown = false; };

          // {passive:false} so e.preventDefault() works and browser scroll is blocked
          canvas.addEventListener('touchstart',  onTouchStart, {passive: false});
          canvas.addEventListener('touchmove',   onTouchMove,  {passive: false});
          canvas.addEventListener('touchend',    onTouchEnd,   {passive: false});
          canvas.addEventListener('mousedown',   onMouseDown);
          canvas.addEventListener('mousemove',   onMouseMove);
          canvas.addEventListener('mouseup',     onMouseUp);
          window.addEventListener('mouseup',     onMouseUp);

          this._cleanup = function () {
            canvas.removeEventListener('touchstart',  onTouchStart);
            canvas.removeEventListener('touchmove',   onTouchMove);
            canvas.removeEventListener('touchend',    onTouchEnd);
            canvas.removeEventListener('mousedown',   onMouseDown);
            canvas.removeEventListener('mousemove',   onMouseMove);
            canvas.removeEventListener('mouseup',     onMouseUp);
            window.removeEventListener('mouseup',     onMouseUp);
          };
        },
        apply: function () {
          var rad = Math.PI / 180;
          this.el.object3D.rotation.set(
            this.pitch * rad,
            this.yaw   * rad,
            0,
            'YXZ'
          );
        },
        remove: function () { this._cleanup && this._cleanup(); }
      });
    </script>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0a0a0a; color: #f0f0f0;
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                     "Pretendard", "Noto Sans KR", sans-serif; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <noscript>이 연구에 참여하려면 JavaScript가 필요합니다.</noscript>
    <div id="root"></div>
  </body>
</html>
